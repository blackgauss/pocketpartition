[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocketpartition"
version = "1.1.3-alpha"
description = "A package for handling numerical sets, semigroups and partitions."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Erik Imathiu-Jones", email = "eimathiucaltech@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/blackgauss/pocketpartition"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketpartition"]

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "pytest>=7.0",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=3.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
